<!DOCTYPE html>
<html lang="es">
<head>

  <!-- Bootstrap 5 -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Estilos propios (en la raíz) -->
  <link href="styles.css" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg ae-nav sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#/inicio">
        <span class="ae-logo">AE</span>
        <span class="ae-brand-text">Aula Ejecutiva</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">

      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="#/inicio">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#/materias">Materias</a></li>
          <li class="nav-item"><a class="nav-link" href="#/panel">Mi progreso</a></li>

  <main id="app"></main>

  <footer class="ae-footer">

      <p class="mb-1">Aula Ejecutiva — Especialidad Ejecutivo Comercial y de Servicio al Cliente</p>

  </footer>

  <!-- El orden importa: primero datos, luego almacenamiento, luego la app (todos en la raíz) -->
  <script src="data.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
